name: Publish grocery app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build reviewed static app
        shell: python
        run: |
          import base64, json, zlib, pathlib
          files = json.loads(zlib.decompress(base64.b64decode('''''')))
          files['splash-v8.webp'] = pathlib.Path('splash-v8.b64').read_text().strip()
          root = pathlib.Path('_site')
          root.mkdir()
          for name, data in files.items():
              (root / name).write_bytes(base64.b64decode(data))
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
